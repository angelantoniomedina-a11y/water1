<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCC - Preservação da Água: Poluição, Pegada Hídrica e Uso Sustentável</title>
    <style>
        :root {
            --primary-blue: #0A4D68;
            --secondary-blue: #088395;
            --light-blue: #EBF4F6;
            --accent-green: #2D6A4F;
            --accent-green-light: #52B788;
            --gray-cinza: #6C757D;
            --earth-brown: #A67C52;
            --bg-light: #F4F9F4;
            --text-dark: #212529;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            overflow-x: hidden;
            padding-top: 80px;
        }

        /* --- MENU SUPERIOR --- */
        header {
            background-color: rgba(10, 77, 104, 0.95);
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            border-bottom: 3px solid var(--earth-brown);
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            color: white;
            font-size: 1.4rem;
            letter-spacing: 0.5px;
        }

        header h1 span {
            color: var(--accent-green-light);
        }

        nav {
            display: flex;
            gap: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 8px 14px;
            border-radius: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        nav a:hover, nav a.active {
            background-color: var(--secondary-blue);
            color: white;
        }

        /* --- HERO SECTION --- */
        .hero-slider {
            position: relative;
            height: 60vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .slider-bg {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.7) 100%), 
                        url('https://unsplash.com') no-repeat center center/cover;
            z-index: 1;
            transition: transform 0.1s ease-out;
        }

        .slider-content {
            position: relative;
            z-index: 2;
            color: white;
            padding: 0 10%;
            max-width: 900px;
        }

        .slider-content h2 {
            font-size: 2.8rem;
            line-height: 1.2;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
        }

        .slider-content p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-left: 5px solid var(--secondary-blue);
            border-radius: 0 10px 10px 0;
        }

        /* --- CONTENEDORES DE CONTENIDO --- */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        .section-panel {
            display: none;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        .section-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            color: var(--primary-blue);
            margin-bottom: 10px;
        }

        .section-subtitle {
            text-align: center;
            color: var(--gray-cinza);
            font-size: 1.05rem;
            max-width: 700px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        /* --- SEÇÃO 1: POLUIÇÃO DA ÁGUA --- */
        .intro-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 35px;
            border-left: 5px solid #C1121F;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .card-list {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 5px solid var(--primary-blue);
        }

        .card-list.causes { border-top-color: #E63946; }
        .card-list.effects { border-top-color: #457B9D; }
        .card-list.solutions { border-top-color: #2D6A4F; }

        .card-list h3 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--primary-blue);
        }

        .card-list ul {
            list-style: none;
        }

        .card-list li {
            margin-bottom: 10px;
            position: relative;
            padding-left: 20px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .card-list li::before {
            content: "•";
            position: absolute;
            left: 5px;
            font-size: 1.3rem;
            line-height: 1;
        }
        .causes li::before { color: #E63946; }
        .effects li::before { color: #457B9D; }
        .solutions li::before { color: #2D6A4F; }

        /* --- SEÇÃO 2: PEGADA HÍDRICA --- */
        .footprint-info {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 35px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            line-height: 1.6;
        }

        .footprint-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            border-bottom: 5px solid var(--gray-cinza);
        }

        .footprint-card.green { border-bottom-color: var(--accent-green); }
        .footprint-card.blue { border-bottom-color: var(--secondary-blue); }
        .footprint-card.gray { border-bottom-color: var(--gray-cinza); }

        .footprint-header {
            padding: 20px;
            color: white;
            font-size: 1.25rem;
            font-weight: bold;
            text-align: center;
        }

        .footprint-card.green .footprint-header { background-color: var(--accent-green); }
        .footprint-card.blue .footprint-header { background-color: var(--secondary-blue); }
        .footprint-card.gray .footprint-header { background-color: var(--gray-cinza); }

        .footprint-body {
            padding: 20px;
            flex-grow: 1;
        }

        .footprint-body p {
            line-height: 1.6;
            margin-bottom: 15px;
            color: #495057;
            font-size: 0.95rem;
        }

        .examples-box {
            background: var(--light-blue);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .examples-box strong {
            display: block;
            margin-bottom: 4px;
            color: var(--primary-blue);
        }

        /* --- SEÇÃO 3: CONSUMO NO BRASIL --- */
        .split-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
            margin-bottom: 35px;
        }

        .highlight-text-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-left: 5px solid var(--accent-green-light);
        }

        .highlight-text-box h3 {
            color: var(--primary-blue);
            margin-bottom: 15px;
            font-size: 1.4rem;
        }

        .highlight-text-box p {
            line-height: 1.6;
            margin-bottom: 15px;
            color: #495057;
        }

        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .chart-card h4 {
            margin-bottom: 20px;
            color: var(--primary-blue);
        }

        /* Donut Chart NATIVO usando SVG */
        .donut-chart {
            transform: rotate(-90deg);
        }

        .double-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .alert-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 4px solid #C1121F;
        }

        .alert-card.warn {
            border-top-color: var(--earth-brown);
        }

        .alert-card h3 {
            margin-bottom: 12px;
            font-size: 1.2rem;
            color: var(--text-dark);
        }

        .alert-card p {
            line-height: 1.6;
            font-size: 0.95rem;
            color: #495057;
        }
